name: Scrape card prices

on:
  schedule:
    # JST 11:00 / 15:00 / 18:00 = UTC 02:00 / 06:00 / 09:00
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {} # 「今すぐ全部更新」用の手動実行ボタン

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run PRICE BASE scraper
        run: npm run scrape:pricebase

      - name: Commit and push updated data
        run: |
          git config user.name "card-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: update card price data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
