name: 買取価格の収集

on:
  schedule:
    # UTC表記。JST = UTC + 9時間 → JST 11:00 / 15:00 / 18:00
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: # Actionsタブの「Run workflow」ボタンで今すぐ実行

permissions:
  contents: write # data/ docs/ backups/ を自動コミットするために必要

# 同時に2つ走ってコミットが衝突しないようにする
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # どれか1つが失敗しても、他の収集とコミットは続ける（最後にジョブ全体は赤くなる）
      - name: カード価格を収集（キャラ別）
        id: cards
        run: node scripts/scrape.js
        continue-on-error: true

      - name: BOX価格を収集（出現・消滅の検知、直前にバックアップ）
        id: box
        run: node scripts/box/run.js
        continue-on-error: true

      - name: 公開ページ用データを生成
        id: build
        run: node scripts/box/build-site.js
        continue-on-error: true

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs backups
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
          # 誰かが同時に push していても取り込んでから push する
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1

      - name: 失敗した工程があれば赤くする
        if: steps.cards.outcome == 'failure' || steps.box.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "カード収集: ${{ steps.cards.outcome }} / BOX収集: ${{ steps.box.outcome }} / 公開データ生成: ${{ steps.build.outcome }}"
          exit 1
